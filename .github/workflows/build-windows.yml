name: Build Study Notebook EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

# 同一分支只保留最新一次构建。
# 如果短时间内连续提交多个改动，旧构建会自动取消。
concurrency:
  group: study-notebook-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.11.1

      - name: Startup smoke test
        shell: powershell
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          @'
          import sys
          from PySide6.QtWidgets import QApplication
          import app as app_module

          qt_app = QApplication([])
          window = app_module.MainWindow()
          window.tree_drop_watcher = app_module.TreeDropWatcher(window)
          window.note_list.viewport().installEventFilter(window.tree_drop_watcher)
          window.show()
          qt_app.processEvents()
          print("STARTUP_SMOKE_TEST_OK")
          window.close()
          qt_app.processEvents()
          '@ | Set-Content -Encoding UTF8 smoke_test.py
          python smoke_test.py

      - name: Build EXE
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name StudyNotebook app.py
          dir dist

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: StudyNotebook-Windows-x64
          path: dist/StudyNotebook.exe
          if-no-files-found: error
          retention-days: 30
