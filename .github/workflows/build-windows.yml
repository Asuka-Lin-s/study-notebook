name: Build Study Notebook EXE

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '**.py'
      - 'requirements.txt'
      - '.github/workflows/build-windows.yml'

concurrency:
  group: study-notebook-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller==6.11.1

      - name: Startup smoke test
        shell: powershell
        run: |
          @'
          import faulthandler
          import traceback
          faulthandler.enable()

          def stage(text):
              print("SMOKE:", text, flush=True)

          try:
              stage("import QApplication")
              from PySide6.QtWidgets import QApplication

              stage("import app")
              import app as app_module

              stage("create QApplication")
              qt_app = QApplication([])

              stage("create MainWindow")
              window = app_module.MainWindow()

              stage("install tree watcher")
              window.tree_drop_watcher = app_module.TreeDropWatcher(window)
              window.note_list.viewport().installEventFilter(window.tree_drop_watcher)

              stage("show MainWindow")
              window.show()

              stage("process events")
              qt_app.processEvents()

              stage("close MainWindow")
              window.close()
              qt_app.processEvents()

              stage("STARTUP_SMOKE_TEST_OK")
          except BaseException:
              traceback.print_exc()
              raise
          '@ | Set-Content -Encoding UTF8 smoke_test.py
          python -u -X faulthandler smoke_test.py

      - name: Build EXE
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name StudyNotebook app.py
          dir dist

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v4
        with:
          name: StudyNotebook-Windows-x64
          path: dist/StudyNotebook.exe
          if-no-files-found: error
          retention-days: 30
